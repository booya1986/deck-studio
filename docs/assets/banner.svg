<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Deck Studio: ממסמך ארגוני אחד למצגת הדרכה ממותגת">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#16396a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="accent" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#b69cff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="120" cy="40" r="180" fill="#7cc4ff" opacity="0.06"/>
  <circle cx="260" cy="360" r="140" fill="#b69cff" opacity="0.07"/>
  <g opacity="0.10" stroke="#ffffff" stroke-width="1">
    <rect x="70" y="92" width="210" height="118" rx="10" fill="none"/>
    <rect x="96" y="70" width="210" height="118" rx="10" fill="none"/>
    <rect x="122" y="48" width="210" height="118" rx="10" fill="none"/>
  </g>

  <text x="1200" y="118" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">Deck Studio</text>
  <rect x="1060" y="136" width="140" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="1200" y="190" text-anchor="end" font-family="'Heebo', 'Rubik', 'Arial Hebrew', Arial, sans-serif" font-size="34" font-weight="600" fill="#d9e7ff">ממסמך ארגוני אחד למצגת הדרכה ממותגת</text>

  <g font-family="'Heebo', 'Rubik', 'Arial Hebrew', Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="1020" y="236" width="180" height="52" rx="26" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="1110" y="270">שפה עיצובית</text>
    <text x="1000" y="270" fill="#7cc4ff">←</text>

    <rect x="800" y="236" width="180" height="52" rx="26" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="890" y="270">מתווה</text>
    <text x="780" y="270" fill="#7cc4ff">←</text>

    <rect x="580" y="236" width="180" height="52" rx="26" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="670" y="270">מחקר ופירוק</text>
    <text x="560" y="270" fill="#7cc4ff">←</text>

    <rect x="360" y="236" width="180" height="52" rx="26" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="450" y="270">בניית מצגת</text>
    <text x="340" y="270" fill="#7cc4ff">←</text>

    <rect x="140" y="236" width="180" height="52" rx="26" fill="#7cc4ff" fill-opacity="0.22" stroke="#7cc4ff" stroke-opacity="0.6"/>
    <text x="230" y="270">בקרת איכות</text>
  </g>

  <text x="1200" y="326" text-anchor="end" font-family="'Heebo', 'Rubik', 'Arial Hebrew', Arial, sans-serif" font-size="18" fill="#8fb0dd">כל שלב נעצר לאישור שלכם</text>
  <text x="80" y="326" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8fb0dd">Claude Agent SDK · Hebrew RTL · Human in the loop</text>
</svg>
